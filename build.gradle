plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	id 'maven-publish'
}
group = project.maven_group
version = "${project.mod_version}+${project.minecraft}"

base {
	archivesName = project.mod_name.toLowerCase()
}

loom {
	mods {
		"viewpoint" {
			sourceSet("main")
		}
	}
	accessWidenerPath = file("src/main/resources/viewpoint.accesswidener")
}

runClient.doFirst {
	args += ['--username', "viewpoint${new Random().nextInt(1000)}"]
}

repositories {
	maven { url 'https://jitpack.io' }
	maven { url 'https://maven.terraformersmc.com/releases/' }
	mavenCentral()
	mavenLocal()
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	flatDir {
		dirs("libs")
	}
	maven { url = "https://maven.quiltmc.org/repository/release/" }
}

dependencies {
	minecraft("com.mojang:minecraft:${project.minecraft}")
	mappings("net.fabricmc:yarn:${project.mappings}:v2")
	modImplementation("net.fabricmc:fabric-loader:${project.fabric_loader}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_api}")
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu}")
	modCompileOnly("maven.modrinth:sodium:${project.sodium}")

	include(modImplementation("org.quiltmc:quilt-config:${project.quilt_config}"))
	include(modImplementation(compileOnly("com.electronwill.night-config:core:${project.toml}")))
	include(modImplementation(compileOnly("com.electronwill.night-config:toml:${project.toml}")))
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("licence") {
		rename { "${it}_${project.mod_name}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}